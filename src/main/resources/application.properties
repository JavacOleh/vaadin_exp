vaadin.launch-browser=true
spring.application.name=web
vaadin.productionMode=true

# --- DataSource ---
spring.datasource.url=jdbc:postgresql://localhost:5433/vaadin_exp_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# --- Hibernate / JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# cmd: docker run --name vaadin_exp -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=vaadin_exp_db -p 5432:5432 -d postgres:latest
